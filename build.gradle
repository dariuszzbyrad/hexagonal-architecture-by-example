plugins {
    id 'java'
    id 'groovy'
    id 'org.springframework.boot' version '3.0.2'
    id 'io.spring.dependency-management' version '1.1.0'
}

group = 'tech.allegro'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    versions = [
            spock     : '2.3-groovy-4.0',
            spring    : '6.0.4',
            springData: '4.0.2',
            lombok    : '1.18.26',
            archunit  : '1.0.1'
    ]
}

dependencies {
    // Spring
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation group: 'org.springframework', name: 'spring-core', version: "${versions.spring}"
    implementation group: 'org.springframework.data', name: 'spring-data-mongodb', version: "${versions.springData}"
    testImplementation group: 'org.spockframework', name: 'spock-spring', version: "${versions.spock}"
    testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test'

    // Lombok
    compileOnly group: 'org.projectlombok', name: 'lombok', version: "${versions.lombok}"
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: "${versions.lombok}"

    // Archunit
    testImplementation group: 'com.tngtech.archunit', name: 'archunit', version: "${versions.archunit}"

}

test {
    testLogging {
        exceptionFormat = 'full'
    }
    useJUnitPlatform()
}

wrapper {
    gradleVersion = '7.5.1'
}
